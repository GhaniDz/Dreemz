[package]
name = "dreemz"
version = "0.1.0"
edition = "2021"
description = "Dreemz - a 2D frame-by-frame animation app in Rust"
license = "MIT"

[dependencies]
eframe = { version = "0.37", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
egui = "0.37"
tiny-skia = "0.12"
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
] }
rfd = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
